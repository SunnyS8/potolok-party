<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Дизайнер — Флюкс | СИС</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .dsg-layout { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 65px); }
    .dsg-sidebar { background: var(--surface-card); border-right: 1px solid var(--border-light); padding: 1.5rem 0; display: flex; flex-direction: column; }
    .dsg-sidebar .brand { padding: 0 1.25rem; font-weight: 700; margin-bottom: 1.25rem; }
    .dsg-sidebar .brand span { color: var(--accent-primary); }
    .dsg-sidebar nav { flex: 1; display: flex; flex-direction: column; gap: 0; }
    .dsg-sidebar nav a { display: block; padding: 0.65rem 1.25rem; font-size: 0.875rem; color: var(--text-secondary); border-left: 3px solid transparent; transition: all 0.15s; text-decoration: none; }
    .dsg-sidebar nav a:hover { color: var(--accent-primary); background: var(--accent-primary-light); }
    .dsg-sidebar nav a.active { color: var(--accent-primary); border-left-color: var(--accent-primary); background: var(--accent-primary-light); font-weight: 500; }
    .dsg-sidebar .user { padding: 0.85rem 1.25rem; border-top: 1px solid var(--border-light); font-size: 0.8rem; color: var(--text-secondary); }
    .dsg-sidebar .user .role { font-weight: 600; color: var(--text-primary); }
    .dsg-sidebar .logout { margin-top: 0.3rem; display: inline-block; color: var(--accent-primary); cursor: pointer; }

    .dsg-content { padding: 1.5rem 2rem; overflow-y: auto; max-height: calc(100vh - 65px); }
    .dsg-section { display: none; }
    .dsg-section.active { display: block; }
    .dsg-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .dsg-head h1 { font-size: 1.35rem; font-weight: 700; }

    .prj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; }
    .prj-card { background: var(--surface-card); border: 1px solid var(--border-light); border-radius: 10px; padding: 1.1rem 1.25rem; cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; gap: 0.5rem; }
    .prj-card:hover { box-shadow: 0 6px 20px rgba(45,42,36,0.07); transform: translateY(-1px); border-color: var(--accent-primary); }
    .prj-card .name { font-weight: 600; font-size: 0.95rem; line-height: 1.3; }
    .prj-card .addr { font-size: 0.8rem; color: var(--text-secondary); }
    .prj-card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.35rem; }
    .prj-card .sum { font-weight: 700; color: var(--accent-primary); font-size: 1rem; }
    .prj-card .status-line { display: flex; align-items: center; gap: 0.5rem; }

    .prj-badge { display: inline-block; padding: 0.15rem 0.55rem; border-radius: 6px; font-size: 0.72rem; font-weight: 500; color: #fff; background: var(--c, #888); }

    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
    .empty-state .big { font-size: 2rem; margin-bottom: 0.5rem; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.55rem 1rem; border-radius: 8px; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.15s; border: none; font-family: var(--font-sans); }
    .btn-primary { background: var(--accent-primary); color: #fff; }
    .btn-primary:hover { background: var(--accent-primary-hover); }
    .btn-outline { background: var(--surface-card); border: 1px solid var(--border-medium); color: var(--text-primary); }
    .btn-outline:hover { border-color: var(--accent-primary); color: var(--accent-primary); }
    .btn-sm { padding: 0.35rem 0.7rem; font-size: 0.8rem; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    .form-grid .full { grid-column: 1 / -1; }
    .form-grid label { font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 0.25rem; }
    .form-grid input { width: 100%; padding: 0.55rem 0.75rem; border: 1px solid var(--border-medium); border-radius: 6px; font-size: 0.875rem; outline: none; font-family: var(--font-sans); }
    .form-grid input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(91,138,140,0.1); }

    .sheet { background: var(--surface-card); border: 1px solid var(--border-light); border-radius: 10px; margin-bottom: 1rem; }
    .sheet-head { padding: 1rem 1.25rem; border-bottom: 1px solid var(--border-light); display: flex; align-items: center; justify-content: space-between; }
    .sheet-head h3 { font-size: 0.95rem; font-weight: 600; }
    .sheet-body { padding: 1rem 1.25rem; }

    .item-row { display: grid; grid-template-columns: 2.2fr 1fr 0.7fr 1fr 1fr auto; gap: 0.6rem; align-items: center; padding: 0.55rem 0; border-bottom: 1px solid var(--border-light); font-size: 0.85rem; }
    .item-row:last-child { border-bottom: none; }
    .item-row.head { color: var(--text-secondary); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
    .item-row input { padding: 0.4rem 0.5rem; border: 1px solid var(--border-medium); border-radius: 5px; font-size: 0.85rem; outline: none; font-family: var(--font-sans); width: 100%; }
    .item-row input:focus { border-color: var(--accent-primary); }
    .item-del { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1rem; padding: 0.2rem 0.4rem; border-radius: 4px; }
    .item-del:hover { color: var(--accent-error); background: #FEF2F2; }

    .totals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }
    .tot-card { background: var(--bg-base); border: 1px solid var(--border-light); border-radius: 8px; padding: 0.75rem 1rem; }
    .tot-card .k { font-size: 0.7rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; }
    .tot-card .v { font-size: 1.15rem; font-weight: 700; margin-top: 0.2rem; }
    .tot-card .v.retail { color: var(--accent-primary); }

    .timeline { display: flex; gap: 0.25rem; align-items: center; flex-wrap: wrap; }
    .tl-step { font-size: 0.7rem; padding: 0.2rem 0.5rem; border-radius: 12px; background: var(--bg-base); color: var(--text-secondary); border: 1px solid var(--border-light); }
    .tl-step.active { background: var(--accent-primary); color: #fff; border-color: var(--accent-primary); font-weight: 600; }
    .tl-arrow { color: var(--text-muted); }

    .msg { font-size: 0.8rem; margin-top: 0.6rem; min-height: 1.2rem; }
    .msg.error { color: var(--accent-error); }
    .msg.info { color: var(--accent-primary); }

    @media (max-width: 768px) {
      .dsg-layout { grid-template-columns: 1fr; }
      .dsg-sidebar { flex-direction: row; align-items: center; padding: 0.5rem; border-right: none; border-bottom: 1px solid var(--border-light); }
      .dsg-sidebar .brand { margin-bottom: 0; padding: 0 0.75rem; }
      .dsg-sidebar nav { flex-direction: row; overflow-x: auto; }
      .dsg-sidebar nav a { border-left: none; border-bottom: 2px solid transparent; white-space: nowrap; padding: 0.5rem 0.75rem; }
      .dsg-sidebar nav a.active { border-left: none; border-bottom-color: var(--accent-primary); }
      .dsg-sidebar .user { border-top: none; padding: 0 0.75rem; }
      .dsg-content { padding: 1rem; }
      .item-row { grid-template-columns: 1fr; gap: 0.35rem; }
      .totals { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container header-inner">
      <div class="logo">Флюкс <span style="font-weight:400;font-size:0.75rem;color:#94A3B8">| СИС</span></div>
      <nav>
        <a href="/">Главная</a>
        <a href="/calculator/">Калькулятор</a>
        <a href="/login.html">Сменить роль</a>
      </nav>
    </div>
  </header>

  <div class="dsg-layout">
    <aside class="dsg-sidebar">
      <div class="brand">Флюкс <span>| СИС</span></div>
      <nav>
        <a href="#" class="active" data-section="projects">Мои проекты</a>
        <a href="#" data-section="new">Новый проект</a>
      </nav>
      <div class="user">
        <div class="role" id="userRole">Дизайнер</div>
        <a class="logout" id="logoutBtn">Выйти</a>
      </div>
    </aside>

    <div class="dsg-content">
      <!-- Список проектов -->
      <section class="dsg-section active" id="sec-projects">
        <div class="dsg-head">
          <h1>Мои проекты</h1>
          <button class="btn btn-primary" onclick="showSection('new')">+ Новый проект</button>
        </div>
        <div id="prjList" class="prj-grid"><div class="empty-state"><div class="big">⏳</div>Загрузка…</div></div>
      </section>

      <!-- Новый проект -->
      <section class="dsg-section" id="sec-new">
        <div class="dsg-head">
          <button class="btn btn-outline btn-sm" onclick="showSection('projects')">← Назад</button>
          <h1 style="margin-left:1rem">Новый проект</h1>
        </div>
        <div class="sheet">
          <div class="sheet-head"><h3>Объект</h3></div>
          <div class="sheet-body">
            <div class="form-grid">
              <div class="full">
                <label>Название</label>
                <input id="npName" placeholder="Квартира — ЖК «Северный парк»">
              </div>
              <div class="full">
                <label>Адрес</label>
                <input id="npAddr" placeholder="г. Москва, ул. Хвойная 3, кв. 118">
              </div>
              <div>
                <label>Клиент</label>
                <input id="npClient" placeholder="Имя">
              </div>
              <div>
                <label>Телефон</label>
                <input id="npPhone" placeholder="+7 916 000-00-00">
              </div>
              <div class="full">
                <label>Ценовой уровень</label>
                <select id="npLevel" style="width:100%;padding:0.55rem 0.75rem;border:1px solid var(--border-medium);border-radius:6px;font-size:0.875rem;outline:none;background:var(--surface-card)">
                  <option value="retail">Розница (клиент/дизайнер)</option>
                  <option value="distributor">Дилерский (закупка + маржа)</option>
                  <option value="cost">Себестоимость (монтаж)</option>
                </select>
              </div>
            </div>
            <div class="msg" id="newMsg"></div>
            <button class="btn btn-primary" style="margin-top:0.75rem" id="createBtn">Создать проект</button>
          </div>
        </div>
      </section>

      <!-- Проект -->
      <section class="dsg-section" id="sec-project">
        <div class="dsg-head">
          <button class="btn btn-outline btn-sm" onclick="showSection('projects')">← Назад</button>
          <h1 id="pvName" style="margin-left:1rem">Проект</h1>
          <span id="pvBadge"></span>
        </div>

        <div class="sheet">
          <div class="sheet-head">
            <h3>Смета</h3>
            <span class="timeline" id="pvTimeline"></span>
          </div>
          <div class="sheet-body">
            <div id="pvItems"></div>
            <button class="btn btn-outline btn-sm" onclick="addRow()" style="margin-top:0.75rem">+ Добавить позицию</button>
          </div>
        </div>

        <div class="sheet">
          <div class="sheet-head"><h3>Итого</h3></div>
          <div class="sheet-body">
            <div class="totals" id="pvTotals"></div>
            <div class="msg" id="pvMsg"></div>
            <div id="pvActions" style="display:flex;gap:0.5rem;margin-top:1rem;flex-wrap:wrap"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script src="/js/auth.js"></script>
  <script src="/js/projects-api.js"></script>
  <script>
    let currentProject = null;
    let currentItems = [];

    const P = FluxProjects;

    function showSection(name) {
      document.querySelectorAll('.dsg-section').forEach(s => s.classList.toggle('active', s.id === 'sec-' + name));
      document.querySelectorAll('.dsg-sidebar nav a').forEach(a => a.classList.toggle('active', a.dataset.section === name));
      if (name === 'projects') loadProjects();
    }

    async function loadProjects() {
      const el = document.getElementById('prjList');
      try {
        const data = await P.Projects.list();
        const list = data.projects || [];
        if (!list.length) {
          el.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div class="big">🎨</div>Проектов пока нет<br>Создайте первый проект</div>';
          return;
        }
        el.innerHTML = list.map(p => {
          const sum = p.totals ? P.fmtMoney(p.pricingLevel === 'cost' ? p.totals.cost : p.pricingLevel === 'distributor' ? p.totals.distributor : p.totals.retail) : '—';
          return '<div class="prj-card" onclick="openProject(' + p.id + ')">' +
            '<div class="name">' + esc(p.name || 'Проект #' + p.id) + '</div>' +
            '<div class="addr">' + esc(p.address || '') + '</div>' +
            '<div class="meta"><span class="status-line">' + P.statusBadge(p.status) + '</span></div>' +
            '<div class="meta"><span>Площадь: ' + (p.totals && p.totals.area ? p.totals.area + ' м²' : '—') + '</span><span class="sum">' + sum + '</span></div>' +
            '</div>';
        }).join('');
      } catch (e) {
        el.innerHTML = '<div class="empty-state"><div class="big">⚠️</div>' + esc(e.message) + '</div>';
      }
    }

    async function openProject(id) {
      try {
        const data = await P.Projects.get(id);
        currentProject = data.project;
        currentItems = (data.project.items || []).map(i => ({ ...i }));
        document.getElementById('pvName').textContent = currentProject.name || 'Проект #' + id;
        document.getElementById('pvBadge').innerHTML = P.statusBadge(currentProject.status);
        renderTimeline();
        renderItems();
        renderTotals();
        renderActions();
        showSection('project');
      } catch (e) { alert(e.message); }
    }

    function renderTimeline() {
      const el = document.getElementById('pvTimeline');
      const idx = P.CHAIN.indexOf(currentProject.status);
      el.innerHTML = P.CHAIN.map((s, i) => {
        const active = i === idx, done = i < idx;
        return (i ? '<span class="tl-arrow">›</span>' : '') +
          '<span class="tl-step' + (active ? ' active' : '') + '" style="' + (done ? 'background:var(--accent-primary);color:#fff;border-color:var(--accent-primary);opacity:.55' : '') + '">' + (P.STATUS_META[s].label) + '</span>';
      }).join('');
    }

    function renderItems() {
      const el = document.getElementById('pvItems');
      const row = (it, i) => {
        const isNew = !it.id;
        return '<div class="item-row' + (isNew ? ' head' : '') + '">' +
          '<input value="' + esc(it.label || '') + '" placeholder="Наименование (Стена СИС, потолок…)" data-i="' + i + '" data-f="label">' +
          '<input type="number" value="' + (it.qty || 1) + '" placeholder="Кол-во" data-i="' + i + '" data-f="qty">' +
          '<input value="' + esc(it.unit || 'м') + '" placeholder="ед." data-i="' + i + '" data-f="unit">' +
          '<input type="number" value="' + (it.price || 0) + '" placeholder="Цена" data-i="' + i + '" data-f="price">' +
          '<div style="text-align:right;font-weight:600;color:var(--accent-primary)">' + P.fmtMoney((it.price || 0) * (it.qty || 1)) + '</div>' +
          '<button class="item-del" onclick="delRow(' + i + ')" title="Удалить">✕</button>' +
          '</div>';
      };
      el.innerHTML = currentItems.length
        ? '<div class="item-row head"><span>Наименование</span><span>Кол-во</span><span>Ед.</span><span>Цена/м²</span><span>Сумма</span><span></span></div>' +
          currentItems.map(row).join('')
        : '<div class="empty-state">Нет позиций — добавьте стены или потолки</div>';
      // live-обновление полей
      el.querySelectorAll('input').forEach(inp => {
        inp.addEventListener('input', () => {
          const it = currentItems[+inp.dataset.i];
          const v = inp.dataset.f === 'qty' || inp.dataset.f === 'price' ? parseFloat(inp.value) || 0 : inp.value;
          it[inp.dataset.f] = v;
          renderTotals();
        });
      });
    }

    function addRow() {
      currentItems.push({ label: '', qty: 1, unit: 'м', price: 0, type: 'wall' });
      renderItems();
    }

    function delRow(i) {
      currentItems.splice(i, 1);
      renderItems();
      renderTotals();
    }

    async function saveItems() {
      if (!currentProject) return;
      // обновляем items через PUT проекта
      const items = currentItems.map(i => {
        const { id, ...rest } = i;
        return rest;
      });
      await P.Projects.update(currentProject.id, { items });
      currentProject = (await P.Projects.get(currentProject.id)).project;
      renderTotals();
    }

    function renderTotals() {
      const t = currentProject.totals || {};
      document.getElementById('pvTotals').innerHTML =
        '<div class="tot-card"><div class="k">Розница</div><div class="v retail">' + P.fmtMoney(t.retail) + '</div></div>' +
        '<div class="tot-card"><div class="k">Дилер (−15%)</div><div class="v">' + P.fmtMoney(t.distributor) + '</div></div>' +
        '<div class="tot-card"><div class="k">Себестоимость</div><div class="v">' + P.fmtMoney(t.cost) + '</div></div>';
    }

    function renderActions() {
      const el = document.getElementById('pvActions');
      const st = currentProject.status;
      let html = '';
      if (st === 'design') {
        html += '<button class="btn btn-primary" onclick="doStatus(\'quoted\')">Выдать КП →</button>';
      }
      if (st === 'quoted') {
        html += '<button class="btn btn-outline" onclick="doStatus(\'design\')">← Внести правки</button>';
      }
      if (st !== 'archive' && st !== 'done' && st !== 'paid' && st !== 'supply' && st !== 'install') {
        html += '<button class="btn btn-outline" onclick="saveItems()">Сохранить смету</button>';
      }
      el.innerHTML = html;
    }

    async function doStatus(status) {
      try {
        await saveItems();
        const data = await P.Projects.setStatus(currentProject.id, status);
        currentProject = data.project;
        openProject(currentProject.id);
      } catch (e) { document.getElementById('pvMsg').className = 'msg error'; document.getElementById('pvMsg').textContent = e.message; }
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Создание проекта
    document.getElementById('createBtn').addEventListener('click', async () => {
      const name = document.getElementById('npName').value.trim();
      if (!name) { document.getElementById('newMsg').className = 'msg error'; document.getElementById('newMsg').textContent = 'Введите название'; return; }
      const msg = document.getElementById('newMsg');
      msg.textContent = '';
      try {
        const data = await P.Projects.create({
          name,
          address: document.getElementById('npAddr').value.trim(),
          customer: { name: document.getElementById('npClient').value.trim(), phone: document.getElementById('npPhone').value.trim() },
          pricingLevel: document.getElementById('npLevel').value,
        });
        document.getElementById('newMsg').className = 'msg info';
        document.getElementById('newMsg').textContent = 'Проект создан';
        ['npName','npAddr','npClient','npPhone'].forEach(id => document.getElementById(id).value = '');
        openProject(data.project.id);
      } catch (e) {
        msg.className = 'msg error'; msg.textContent = e.message;
      }
    });

    // Выход
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      await FluxAuth.logout();
      window.location.href = '/login.html';
    });

    // Гард роли: только дизайнер
    (async () => {
      const data = await FluxAuth.me();
      if (!data.role) { window.location.href = '/login.html'; return; }
      if (data.role !== 'designer') { window.location.href = FluxAuth.ROLE_PAGE ? (FluxAuth.ROLE_PAGE[data.role] || '/login.html') : '/login.html'; return; }
      loadProjects();
    })();
  </script>
</body>
</html>
