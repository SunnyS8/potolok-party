<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Личный кабинет — Флюкс | СИС</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        :root {
          --bg-base: #F8F7F4;
          --text-primary: #2D2A24;
          --text-secondary: #8A8580;
          --text-muted: #B0ABA4;
          --surface-card: #FFFFFF;
          --border-light: #EAE8E3;
          --border-medium: #D6D3CD;
          --accent-primary: #5B8A8C;
          --accent-primary-hover: #4D7A7C;
          --accent-primary-light: #E8F0EE;
          --accent-success: #7DAB7D;
          --accent-error: #C97A7A;
          --shadow-card: 0 1px 3px rgba(45,42,36,0.04), 0 1px 2px rgba(45,42,36,0.03);
          --shadow-elevated: 0 4px 12px rgba(45,42,36,0.06);
          --radius-lg: 16px;
          --radius-md: 10px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-base); color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        ::selection { background: var(--accent-primary-light); }
        .container { width: 100%; max-width: 520px; padding: 24px 16px; }

        .header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 0; margin-bottom: 24px;
        }
        .header .brand { font-size: 18px; font-weight: 700; color: var(--text-primary); }
        .header .brand span { color: var(--accent-primary); }
        .header .brand .sub { font-size:11px; font-weight:400; color:var(--text-muted); margin-left:4px; }
        .header .logout { font-size: 13px; color: var(--text-secondary); cursor: pointer; text-decoration: none; }
        .header .logout:hover { color: var(--accent-error); }

        .login-section {
            background: var(--surface-card); border-radius: var(--radius-lg);
            padding: 40px 32px; box-shadow: var(--shadow-card);
            text-align: center; margin-top: 40px;
        }
        .login-section .icon { font-size: 48px; margin-bottom: 16px; }
        .login-section h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .login-section p { font-size: 14px; color: var(--text-secondary); margin-bottom: 32px; line-height: 1.5; }
        .login-section input {
            width: 100%; padding: 14px 16px; font-size: 16px;
            border: 2px solid var(--border-medium); border-radius: var(--radius-md);
            outline: none; margin-bottom: 16px; text-align: center;
            font-family: inherit; transition: border-color 0.2s;
            letter-spacing: 2px; color: var(--text-primary);
        }
        .login-section input:focus { border-color: var(--accent-primary); box-shadow: 0 0 0 3px rgba(91,138,140,0.1); }
        .login-section .phone-input { letter-spacing: 0; text-align: left; }
        .login-section button {
            width: 100%; padding: 14px; font-size: 16px; font-weight: 600;
            background: var(--accent-primary); color: white; border: none; border-radius: var(--radius-md);
            cursor: pointer; transition: all 0.2s;
        }
        .login-section button:hover { background: var(--accent-primary-hover); }
        .login-section button:disabled { background: var(--border-medium); color: var(--text-muted); cursor: not-allowed; }
        .login-section .error { color: var(--accent-error); font-size: 13px; margin-top: 12px; display: none; }
        .login-section .hint { font-size: 12px; color: var(--text-muted); margin-top: 16px; }
        .login-section .step-indicator { display: flex; gap: 8px; justify-content: center; margin-bottom: 24px; }
        .login-section .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-light); }
        .login-section .step-dot.active { background: var(--accent-primary); width: 24px; border-radius: 4px; }

        .orders-section { display: none; }
        .orders-section .welcome {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-primary-hover) 100%);
            color: white; border-radius: var(--radius-lg); padding: 28px 24px;
            margin-bottom: 24px;
        }
        .orders-section .welcome h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
        .orders-section .welcome p { font-size: 14px; opacity: 0.85; }

        .order-card {
            background: var(--surface-card); border-radius: var(--radius-md);
            padding: 20px; margin-bottom: 16px;
            box-shadow: var(--shadow-card);
            cursor: pointer; transition: all 0.2s;
        }
        .order-card:hover { box-shadow: var(--shadow-elevated); }
        .order-card .order-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px;
        }
        .order-card .order-id { font-size: 12px; font-weight: 600; color: var(--text-muted); letter-spacing: 1px; }
        .order-card .status-badge {
            font-size: 11px; font-weight: 600; padding: 4px 12px;
            border-radius: 20px; text-transform: uppercase; letter-spacing: 1px;
        }
        .status-badge.new { background: var(--accent-primary-light); color: var(--accent-primary); }
        .status-badge.negotiation { background: #F5EDE6; color: #C48B6F; }
        .status-badge.measurement_scheduled { background: #E8F0EE; color: #4D7A7C; }
        .status-badge.measurement_done { background: #EEF4EC; color: #5A8A5A; }
        .status-badge.installation_scheduled { background: #F0EAE6; color: #A67A64; }
        .status-badge.won { background: #EEF4EC; color: #5A8A5A; }
        .status-badge.lost { background: #F7EDED; color: #B06060; }
        .order-card .order-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }
        .order-card .order-meta { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
        .order-card .order-meta span { display: block; }

        .detail-section { display: none; }
        .detail-section .back {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--accent-primary); font-size: 14px; font-weight: 500;
            cursor: pointer; margin-bottom: 20px; text-decoration: none;
        }
        .detail-section .back:hover { color: var(--accent-primary-hover); }
        .detail-card {
            background: var(--surface-card); border-radius: var(--radius-md);
            padding: 24px; margin-bottom: 16px;
            box-shadow: var(--shadow-card);
        }
        .detail-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
        .detail-card .row {
            display: flex; justify-content: space-between; padding: 8px 0;
            font-size: 14px; border-bottom: 1px solid var(--border-light);
        }
        .detail-card .row:last-child { border-bottom: none; }
        .detail-card .row .label { color: var(--text-secondary); }
        .detail-card .row .value { font-weight: 500; }

        .timeline { position: relative; padding-left: 28px; }
        .timeline::before {
            content: ''; position: absolute; left: 8px; top: 8px;
            width: 2px; height: calc(100% - 16px); background: var(--border-light);
        }
        .timeline-item { position: relative; padding-bottom: 24px; }
        .timeline-item:last-child { padding-bottom: 0; }
        .timeline-item::before {
            content: ''; position: absolute; left: -24px; top: 4px;
            width: 12px; height: 12px; border-radius: 50%;
            background: var(--border-light); border: 2px solid var(--bg-base);
        }
        .timeline-item.done::before { background: var(--accent-success); border-color: #EEF4EC; }
        .timeline-item.current::before {
            background: var(--accent-primary); border-color: var(--accent-primary-light);
            box-shadow: 0 0 0 4px rgba(91,138,140,0.15);
        }
        .timeline-item .t-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
        .timeline-item .t-date { font-size: 12px; color: var(--text-secondary); }

        .quote-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .quote-table td { padding: 8px 0; border-bottom: 1px solid var(--border-light); }
        .quote-table .q-label { color: var(--text-secondary); }
        .quote-table .q-value { text-align: right; font-weight: 600; }
        .quote-table .q-total { font-size: 18px; font-weight: 800; color: var(--accent-primary); border-bottom: none; padding-top: 12px; }

        .loading {
            display: flex; align-items: center; justify-content: center;
            padding: 40px; gap: 8px;
        }
        .loading .spinner {
            width: 20px; height: 20px; border: 2px solid var(--border-light);
            border-top-color: var(--accent-primary); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">

        <div class="header">
            <div class="brand">Флюкс<span class="sub">| СИС</span></div>
            <a class="logout" id="logoutBtn" onclick="logout()" style="display:none">Выйти</a>
        </div>

        <div class="login-section" id="loginSection">
            <div class="step-indicator" id="stepIndicator">
                <div class="step-dot active"></div>
                <div class="step-dot"></div>
            </div>
            <div class="icon" id="loginIcon">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="var(--accent-primary)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <h1 id="loginTitle">Войти в кабинет</h1>
            <p id="loginDesc">Введите номер телефона, чтобы увидеть статус ваших заказов</p>
            <input type="tel" id="phoneInput" class="phone-input" placeholder="+7 (999) 123-45-67" maxlength="18">
            <input type="text" id="codeInput" placeholder="Код из SMS" maxlength="4" style="display:none">
            <div class="error" id="loginError">Неверный код</div>
            <button id="loginBtn" onclick="submitLogin()">Получить код</button>
            <div class="hint">Демо-режим: введите телефон и код <strong>0000</strong></div>
        </div>

        <div class="orders-section" id="ordersSection">
            <div class="welcome">
                <h2 id="welcomeName">Здравствуйте!</h2>
                <p>Ваши заказы и статусы</p>
            </div>
            <div id="ordersList"></div>
        </div>

        <div class="detail-section" id="detailSection">
            <a class="back" onclick="closeDetail()">← Назад к списку</a>
            <div id="detailContent"></div>
        </div>

    </div>

    <script>
        let token = localStorage.getItem('client_token');
        let currentData = null;
        let loginStep = 'phone';
        let savedPhone = '';

        function show(el) { el.style.display = 'block'; }
        function hide(el) { el.style.display = 'none'; }

        function submitLogin() {
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('loginError');
            const phoneInput = document.getElementById('phoneInput');
            const codeInput = document.getElementById('codeInput');
            const step = document.getElementById('stepIndicator').children;
            const phone = phoneInput.value.replace(/\D/g, '');

            if (loginStep === 'phone') {
                if (phone.length < 10) { error.textContent = 'Введите номер телефона'; error.style.display = 'block'; return; }
                btn.disabled = true; btn.textContent = 'Отправляем...';
                fetch('/api/client/code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone }) })
                    .then(r => r.json())
                    .then(d => {
                        if (d.error) { throw new Error(d.error); }
                        loginStep = 'code'; savedPhone = phone;
                        btn.disabled = false; btn.textContent = 'Подтвердить код';
                        codeInput.style.display = ''; codeInput.focus();
                        phoneInput.style.display = 'none';
                        document.getElementById('loginTitle').textContent = 'Введите код';
                        document.getElementById('loginDesc').textContent = 'Мы отправили код на ваш номер';
                        step[0].classList.remove('active'); step[1].classList.add('active');
                        error.style.display = 'none';
                    })
                    .catch((e) => { btn.disabled = false; btn.textContent = 'Получить код'; error.textContent = e.message || 'Ошибка сервера'; error.style.display = 'block'; });
            } else {
                const code = codeInput.value.trim();
                if (!code) { error.textContent = 'Введите код'; error.style.display = 'block'; return; }
                btn.disabled = true; btn.textContent = 'Входим...';
                fetch('/api/client/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ phone: savedPhone, code }) })
                    .then(r => r.json())
                    .then(d => {
                        if (d.ok) {
                            localStorage.setItem('client_token', d.token);
                            token = d.token;
                            loadOrders();
                            hide(document.getElementById('loginSection'));
                            document.getElementById('logoutBtn').style.display = '';
                        } else {
                            error.textContent = d.error || 'Неверный код';
                            error.style.display = 'block';
                            btn.disabled = false; btn.textContent = 'Подтвердить код';
                        }
                    })
                    .catch(() => { btn.disabled = false; btn.textContent = 'Подтвердить код'; error.textContent = 'Ошибка сервера'; error.style.display = 'block'; });
            }
        }

        function loadOrders() {
            const section = document.getElementById('ordersSection');
            const list = document.getElementById('ordersList');
            show(section); hide(document.getElementById('detailSection'));
            list.innerHTML = '<div class="loading"><div class="spinner"></div> Загрузка...</div>';

            fetch('/api/client/orders?token=' + encodeURIComponent(token))
                .then(r => r.json())
                .then(d => {
                    currentData = d;
                    renderOrders(d);
                })
                .catch(() => { list.innerHTML = '<p style="text-align:center;color:var(--text-secondary)">Ошибка загрузки</p>'; });
        }

        function renderOrders(data) {
            const list = document.getElementById('ordersList');
            const welcome = document.getElementById('welcomeName');
            const calcReqs = (data.calcRequests || []).map(r => ({ ...r, _type: 'calc' }));
            const allOrders = [...(data.deals || []), ...(data.leads || []).filter(l => !data.deals.some(d => d.leadId === l.id)), ...calcReqs];
            const name = data.leads?.[0]?.name || data.deals?.[0]?.name || 'Клиент';
            welcome.textContent = 'Здравствуйте, ' + name + '!';

            if (allOrders.length === 0) {
                list.innerHTML = '<div class="order-card" style="text-align:center;color:var(--text-secondary)"><p>У вас пока нет заказов</p></div>';
                return;
            }

            allOrders.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
            list.innerHTML = allOrders.map(o => {
                if (o._type === 'calc') {
                    const calcOpts = o.options ? JSON.parse(o.options) : [];
                    const prodLabel = o.productType === 'combined' ? 'Потолки+Стены' : o.productType === 'walls' ? 'СИС' : 'Потолок';
                    const accentBorder = o.productType === 'combined' ? 'var(--accent-success)' : 'var(--accent-primary)';
                    return '<div class="order-card" style="border-left:3px solid ' + accentBorder + '">' +
                        '<div class="order-header"><span class="order-id">#C-' + o.id + '</span><span class="status-badge" style="background:var(--accent-primary-light);color:var(--accent-primary)">' + prodLabel + '</span></div>' +
                        '<div class="order-title">' + (o.ceilingType || 'Расчёт') + (o.area ? ' — ' + o.area + ' м²' : '') + '</div>' +
                        '<div class="order-meta">' +
                        (calcOpts.length ? '<span>Опции: ' + calcOpts.map(x => x.name || x).join(', ') + '</span>' : '') +
                        '<span>' + new Date(o.created_at).toLocaleDateString('ru-RU') + '</span></div>' +
                    '</div>';
                }
                const isDeal = !!o.leadId;
                const status = o.status || 'new';
                const statusLabels = { new: 'Новая заявка', negotiation: 'Согласование', measurement_scheduled: 'Назначен замер', measurement_done: 'Замер выполнен', installation_scheduled: 'Назначен монтаж', won: 'Выполнен', lost: 'Отменён' };
                const id = isDeal ? 'D-' + o.id : 'L-' + o.id;
                const date = o.created_at ? new Date(o.created_at).toLocaleDateString('ru-RU') : '—';
                return '<div class="order-card" onclick="openDetail(' + (isDeal ? '\'deal\',' + o.id : '\'lead\',' + o.id) + ')">' +
                    '<div class="order-header"><span class="order-id">#' + id + '</span><span class="status-badge ' + status + '">' + (statusLabels[status] || status) + '</span></div>' +
                    '<div class="order-title">' + (o.ceilingType || 'Консультация') + (o.area ? ' — ' + o.area + ' м²' : '') + '</div>' +
                    '<div class="order-meta"><span>' + date + '</span></div>' +
                '</div>';
            }).join('');
        }

        function openDetail(type, id) {
            const section = document.getElementById('detailSection');
            const content = document.getElementById('detailContent');
            hide(document.getElementById('ordersSection'));
            show(section);

            let item;
            if (type === 'deal') item = currentData.deals.find(d => d.id === id);
            else item = currentData.leads.find(l => l.id === id);

            if (!item) { content.innerHTML = '<p>Не найдено</p>'; return; }

            const isDeal = type === 'deal';
            const statusLabels = { new: 'Новая заявка', negotiation: 'Согласование', measurement_scheduled: 'Назначен замер', measurement_done: 'Замер выполнен', installation_scheduled: 'Назначен монтаж', won: 'Выполнен', lost: 'Отменён' };

            const timelineSteps = [
                { key: 'new', label: 'Заявка принята' },
                { key: 'negotiation', label: 'Согласование' },
                { key: 'measurement_scheduled', label: 'Замер' },
                { key: 'measurement_done', label: 'Замер выполнен' },
                { key: 'installation_scheduled', label: 'Монтаж' },
                { key: 'won', label: 'Готово' },
            ];
            const statusOrder = ['new', 'negotiation', 'measurement_scheduled', 'measurement_done', 'installation_scheduled', 'won'];
            const currentIdx = statusOrder.indexOf(item.status);

            content.innerHTML = '<div class="detail-card">' +
                '<h3>#' + (isDeal ? 'D-' : 'L-') + item.id + ' — ' + (item.ceilingType || 'Консультация') + '</h3>' +
                '<div class="row"><span class="label">Статус</span><span class="value"><span class="status-badge ' + (item.status) + '">' + (statusLabels[item.status] || item.status) + '</span></span></div>' +
                (item.area ? '<div class="row"><span class="label">Площадь</span><span class="value">' + item.area + ' м²</span></div>' : '') +
                (item.estimatedPrice ? '<div class="row"><span class="label">Стоимость</span><span class="value">' + Number(item.estimatedPrice).toLocaleString() + ' ₽</span></div>' : '') +
                (item.created_at ? '<div class="row"><span class="label">Создан</span><span class="value">' + new Date(item.created_at).toLocaleDateString('ru-RU') + '</span></div>' : '') +
            '</div>' +
            '<div class="detail-card"><h3>Этапы</h3><div class="timeline">' +
            timelineSteps.map((step, i) => {
                let cls = '';
                if (i < currentIdx) cls = 'done';
                else if (i === currentIdx) cls = 'current';
                return '<div class="timeline-item ' + cls + '"><div class="t-title">' + step.label + '</div></div>';
            }).join('') +
            '</div></div>';

            if (isDeal && currentData.quotes) {
                const quotes = currentData.quotes.filter(q => q.dealId === item.id);
                if (quotes.length) {
                    content.innerHTML += '<div class="detail-card"><h3>Коммерческое предложение</h3>' +
                        quotes.map(q => '<div style="font-size:14px;color:var(--text-secondary);line-height:1.6;white-space:pre-wrap">' + q.text + '</div>').join('') +
                    '</div>';
                }
            }
        }

        function closeDetail() {
            hide(document.getElementById('detailSection'));
            show(document.getElementById('ordersSection'));
        }

        function logout() {
            localStorage.removeItem('client_token');
            token = null;
            hide(document.getElementById('ordersSection'));
            hide(document.getElementById('detailSection'));
            document.getElementById('logoutBtn').style.display = 'none';
            show(document.getElementById('loginSection'));
            document.getElementById('phoneInput').value = '';
            document.getElementById('phoneInput').style.display = '';
            document.getElementById('codeInput').value = '';
            document.getElementById('codeInput').style.display = 'none';
            document.getElementById('loginTitle').textContent = 'Войти в кабинет';
            document.getElementById('loginDesc').textContent = 'Введите номер телефона, чтобы увидеть статус ваших заказов';
            document.getElementById('loginBtn').textContent = 'Получить код';
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('stepIndicator').children[0].classList.add('active');
            document.getElementById('stepIndicator').children[1].classList.remove('active');
        }

        if (token) {
            loadOrders();
            hide(document.getElementById('loginSection'));
            document.getElementById('logoutBtn').style.display = '';
        }

        document.getElementById('phoneInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitLogin(); });
        document.getElementById('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitLogin(); });
    </script>
</body>
</html>
